name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC): no npm token is stored in GitHub

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A personal access token, so the release pull request triggers CI like any other.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, required for Trusted Publishing
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Open the release pull request, or publish to npm when it is merged
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
